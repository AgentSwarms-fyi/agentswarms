# Egress proxy for notebook kernels — default-deny, allowlist only.
#
# Kernels have NO direct internet route (they sit on an `internal` Docker
# network / behind a deny-all NetworkPolicy on K8s); their only way out is this
# proxy, which permits ONLY the domains in ./allowed_domains.
#
# Do not hand-edit allowed_domains or allowed_ips: the app regenerates both from
# notebook_runtime_settings.egress_allowlist whenever an administrator saves
# Admin -> Developer runtime, and then restarts this container so squid re-reads
# them. They are untracked for that reason; the tracked templates a fresh install
# starts from are allowed_domains.default and allowed_ips.default.
http_port 3128

acl allowed_domains dstdomain "/etc/squid/egress/allowed_domains"
# dstdomain never matches a raw-IP URL, so IP entries from the admin
# allow-list land in a separate dst ACL (self-hosted MinIO on a LAN address
# is the common case).
acl allowed_ips dst "/etc/squid/egress/allowed_ips"
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
# S3-compatible object stores: MinIO's conventional port and the local-dev
# port the docs use.
acl Safe_ports port 9000
acl Safe_ports port 19000
acl CONNECT method CONNECT

# Loopback and link-local destinations are refused before anything is allowed
# (R463). An allow-listed DOMAIN is resolved by squid, and whoever controls its
# DNS can point it anywhere — including 169.254.169.254, the cloud metadata
# service that hands out the instance's credentials, 169.254.170.2 (ECS task
# credentials), or squid's own loopback. No kernel has a reason to reach
# either range, so no allow-list entry, IP or domain, can open it. Private LAN
# ranges (10/8, 172.16/12, 192.168/16) are NOT refused here: a LAN or Docker
# object store such as 192.168.1.10:19000 or `minio` is the ordinary
# self-hosted case. The AWS egress proxy refuses those too, unless listed.
acl blocked_dst dst 127.0.0.0/8 169.254.0.0/16 0.0.0.0/8 ::1 fe80::/10

# Only CONNECT to 443 (HTTPS), and only to allowlisted destinations.
http_access deny CONNECT !SSL_ports
http_access deny !Safe_ports
http_access deny blocked_dst
http_access allow allowed_domains
http_access allow allowed_ips
http_access deny all

# Don't leak client details upstream.
forwarded_for delete
via off
httpd_suppress_version_string on

# Keep it lean; no on-disk cache.
cache deny all
