{{- if .Values.secrets.externalSecrets.enabled }}
{{- $es := .Values.secrets.externalSecrets }}
# The deployment's keys, copied from AWS Secrets Manager by External Secrets
# into the Secret every pod reads. A hook, so they exist before the deploy Job
# that needs them runs on install.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels: {{- include "as.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {{- toYaml $es.storeRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ required "secrets.externalSecrets.remoteKey is required" $es.remoteKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.databaseMaster.name }}
  labels: {{- include "as.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {{- toYaml $es.storeRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.databaseMaster.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.secrets.databaseMaster.key }}
      remoteRef:
        key: {{ required "secrets.externalSecrets.databaseMasterRemoteKey is required" $es.databaseMasterRemoteKey }}
        property: password
{{- end }}
