# The app's identity: in Kubernetes, the Role in the sandboxes' namespace;
# on EKS, a Pod Identity association adds its IAM role (the lake, its key).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels: {{- include "as.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The k8s sandbox backend calls the API server with this account's token.
automountServiceAccountToken: true
---
# storage-api's identity: the storage bucket only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.storageServiceAccount.name }}
  labels: {{- include "as.labels" . | nindent 4 }}
  {{- with .Values.storageServiceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
# Everything else: no API token at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentswarms-plain
  labels: {{- include "as.labels" . | nindent 4 }}
automountServiceAccountToken: false
