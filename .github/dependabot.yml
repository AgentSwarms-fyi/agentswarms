# Dependabot was already opening pull requests against this repository with no
# configuration governing them, which produces a steady trickle of one-package
# PRs that are individually tedious and collectively ignored. This groups them
# so review is a weekly batch rather than a stream.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps travel together: they are the ones that are safe
      # to merge on a green CI run, and reviewing thirty of them separately is
      # how a security patch ends up buried.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Majors are deliberate migrations, not dependency hygiene. React 19,
      # Vite and TanStack Start are load-bearing here; a major arriving as an
      # automated PR invites a merge that breaks the build for everyone.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  # Third-party images are pinned as tag@sha256 (VA-24), which never moves on
  # its own: these propose the next tag and its digest together, so a pin
  # does not quietly age into the image scan's CVE list. Majors stay manual
  # for the same reason as npm (Postgres, Spark and Valkey majors are
  # migrations). The k8s entries read the image: lines in the manifests.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(images)"
  - package-ecosystem: docker
    directories: ["/deploy/k8s/app", "/deploy/k8s/notebooks"]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(images)"

  # Keep the workflow's own actions current. Stale action majors are a common
  # source of sudden CI breakage when GitHub retires a runtime.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
