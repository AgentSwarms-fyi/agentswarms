<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — AgentSwarms</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .card {
        max-width: 24rem;
        padding: 2rem;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 1rem;
        display: block;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #94a3b8;
        font-size: 0.9rem;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        background: #6366f1;
        color: #fff;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0.6rem 1.2rem;
        cursor: pointer;
      }
      button:hover {
        background: #4f46e5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/pwa-icon.svg" alt="AgentSwarms" class="logo" />
      <h1>You're offline</h1>
      <p>
        AgentSwarms needs a connection to load this page. Check your network and try again — pages
        you've already opened may still work.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
